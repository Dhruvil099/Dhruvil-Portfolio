<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A seven-link harm pathway: the first links are lit by evidence, an authority gate stands at link five, and the final links stay dark before an irreversible harm">
  <defs>
    <linearGradient id="evidenceFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3987e5" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#3987e5" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#3987e5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="litLink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86b6ef"/>
      <stop offset="100%" stop-color="#3987e5"/>
    </linearGradient>
    <radialGradient id="nodeGlow">
      <stop offset="0%" stop-color="#3987e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="harmGlow">
      <stop offset="0%" stop-color="#d95926" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d95926" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#0d1215"/>

  <!-- evidence band over the early links -->
  <rect x="120" y="316" width="900" height="232" rx="18" fill="url(#evidenceFade)"/>
  <text x="150" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#86b6ef">evidence reaches here</text>

  <!-- chain connectors -->
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="246" y1="440" x2="334" y2="440" stroke="#3987e5"/>
    <line x1="426" y1="440" x2="514" y2="440" stroke="#3987e5"/>
    <line x1="606" y1="440" x2="694" y2="440" stroke="#3987e5"/>
    <line x1="786" y1="440" x2="874" y2="440" stroke="#1c5cab"/>
    <line x1="966" y1="440" x2="1054" y2="440" stroke="#2b3438" stroke-dasharray="9 11"/>
    <line x1="1146" y1="440" x2="1234" y2="440" stroke="#2b3438" stroke-dasharray="9 11"/>
    <line x1="1326" y1="440" x2="1414" y2="440" stroke="#2b3438" stroke-dasharray="9 11"/>
  </g>

  <!-- lit links 1-4 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="600" fill="#0d1215" text-anchor="middle">
    <circle cx="200" cy="440" r="92" fill="url(#nodeGlow)"/>
    <circle cx="200" cy="440" r="46" fill="url(#litLink)"/>
    <text x="200" y="449">1</text>
    <circle cx="380" cy="440" r="92" fill="url(#nodeGlow)"/>
    <circle cx="380" cy="440" r="46" fill="url(#litLink)"/>
    <text x="380" y="449">2</text>
    <circle cx="560" cy="440" r="92" fill="url(#nodeGlow)"/>
    <circle cx="560" cy="440" r="46" fill="url(#litLink)"/>
    <text x="560" y="449">3</text>
    <circle cx="740" cy="440" r="92" fill="url(#nodeGlow)"/>
    <circle cx="740" cy="440" r="46" fill="url(#litLink)"/>
    <text x="740" y="449">4</text>
  </g>

  <!-- link 5: authority -->
  <circle cx="920" cy="440" r="46" fill="#1c5cab"/>
  <text x="920" y="449" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="600" fill="#cfe0f6">5</text>

  <!-- the authority gate: two posts straddling link 5 -->
  <rect x="906" y="212" width="28" height="132" rx="8" fill="#14191c" stroke="#3987e5" stroke-width="3"/>
  <rect x="906" y="566" width="28" height="132" rx="8" fill="#14191c" stroke="#3987e5" stroke-width="3"/>
  <text x="920" y="186" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#86b6ef">authority gate</text>

  <!-- dark links 6-7 -->
  <circle cx="1100" cy="440" r="46" fill="none" stroke="#2b3438" stroke-width="3"/>
  <text x="1100" y="449" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#4a565c">6</text>
  <circle cx="1280" cy="440" r="46" fill="none" stroke="#2b3438" stroke-width="3"/>
  <text x="1280" y="449" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#4a565c">7</text>

  <!-- the harm end -->
  <circle cx="1460" cy="440" r="86" fill="url(#harmGlow)"/>
  <rect x="1424" y="404" width="72" height="72" rx="14" fill="#14191c" stroke="#d95926" stroke-width="3"/>
  <path d="M1460 424 v26 M1460 460 v3" stroke="#d95926" stroke-width="6" stroke-linecap="round"/>

  <!-- labels -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" text-anchor="middle">
    <text x="200" y="526" fill="#a9b4ad">deployment</text>
    <text x="380" y="526" fill="#a9b4ad">bad objective</text>
    <text x="560" y="526" fill="#a9b4ad">unsafe behaviour</text>
    <text x="740" y="526" fill="#a9b4ad">capability</text>
    <text x="920" y="526" fill="#86b6ef">authority</text>
    <text x="1100" y="526" fill="#75817a">failed detection</text>
    <text x="1280" y="526" fill="#75817a">irreversible</text>
    <text x="1460" y="526" fill="#d9926a">harm</text>
  </g>

  <!-- untested bracket -->
  <text x="1190" y="354" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#75817a">not tested</text>
  <path d="M1054 388 v-16 h272 v16" fill="none" stroke="#2b3438" stroke-width="2"/>

  <!-- the rule -->
  <text x="150" y="752" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" fill="#e8ede9">capability does not confer authority</text>
  <text x="150" y="794" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#75817a">a benchmark score informs the decision only through the link it measures</text>
</svg>
